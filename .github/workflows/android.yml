name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.rickciaahd --project-name life_admin .
          rm -f test/widget_test.dart

      - name: Configure Android notifications
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          text = text.replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')

          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )

          if 'coreLibraryDesugaring(' not in text:
              text += '''\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'''

          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
                  1,
              )

          receivers = '''
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          '''

          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace('</application>', receivers + '\n    </application>', 1)

          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeadmin-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
